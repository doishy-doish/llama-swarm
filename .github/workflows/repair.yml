name: repair
# Closed repair loop v2: prev artifact -> first fence with a fn item -> templated prompt ->
# worker dispatch -> watch -> new fence -> optional machine grade.
# Never pastes raw output back (echo doctrine, LAB-LOG 459): the repairable unit
# is the FIRST fence containing a fn item; context is rebuilt from inputs, not echoed.
# v2 (LAB-LOG 462, 464): multi-fence outputs may trail fn-less echo fences, so
# last-fence-blindly risks grabbing an empty fence (vacuous-green class #3).
# v1 races: new-run lookup takes the newest worker run (no concurrent dispatches
# during repair tests). Generic over tasks; auto-grade is options1-only.
on:
  workflow_dispatch:
    inputs:
      prev_run_id:
        description: 'Worker run id whose draft-output artifact holds the broken fence'
        required: true
      failures:
        description: 'Newline-separated failure lines, e.g. maybe_ice_cream(22) returned None, expected Some(0)'
        required: true
      scope:
        description: 'narrow (only named mappings) or broad (re-audit whole function)'
        required: false
        default: 'narrow'
      brain:
        description: 'Brain script basename (draft or draft-qwen3)'
        required: false
        default: 'draft-qwen3'
      think:
        description: 'Qwen3 thinking mode (0=/no_think, 1=/think)'
        required: false
        default: '1'
      auto_grade:
        description: 'Dispatch grade.yml on the new run (options1 only)'
        required: false
        default: 'true'
      grade_task_id:
        description: 'Grading table for the auto-grade step'
        required: false
        default: 'options1'
permissions:
  actions: write
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: build repair prompt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ inputs.prev_run_id }} -n draft-output -R ${{ github.repository }} -D prev
          python3 - <<'EOF'
          import re
          text = open('prev/draft-output.md', errors='replace').read()
          fences = []
          cur = None
          for line in text.splitlines():
              ln = line.strip()
              if ln.startswith("```rust"):
                  cur = []
              elif ln == "```" and cur is not None:
                  fences.append("\n".join(cur))
                  cur = None
              elif cur is not None:
                  cur.append(line)
          if not fences:
              print('FAIL: no fence in prev artifact')
              raise SystemExit(1)
          # first fence containing a fn item: multi-fence outputs may trail
          # fn-less echo fences (LAB-LOG 462); last-fence blindly risks the empty one.
          prev = None
          for f in fences:
              if re.search(r"\bfn\s+\w+[^\n{]*\{", f):
                  prev = f.strip()
          if prev is None:
              print('FAIL: no fence with a fn item in prev artifact')
              raise SystemExit(1)
          print('PREV FENCE: %d fences, repairable %d bytes' % (len(fences), len(prev)))
          scope = '${{ inputs.scope }}'
          if scope == 'narrow':
              scope_line = 'SCOPE: Change ONLY the mappings named above. Do not touch anything else.'
          elif scope == 'broad':
              scope_line = ('SCOPE: After fixing the named mappings, re-audit the ENTIRE function '
                            'against the spec so that every input maps correctly. Fix anything else you find.')
          else:
              print('FAIL: scope must be narrow or broad')
              raise SystemExit(1)
          prompt = ('Repair this Rust function. Your previous version is WRONG. Test results:\n'
                    + '\n'.join('- ' + l for l in '''${{ inputs.failures }}'''.splitlines() if l.strip())
                    + '\nYour previous code:\n```rust\n' + prev + '\n```\n'
                    + scope_line + '\nOutput ONLY the corrected function in one rust fence and nothing else.\n')
          open('prompt.txt', 'w').write(prompt)
          print('PROMPT: %d bytes' % len(prompt))
          EOF
          ls -la prompt.txt
      - name: serial guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh run list -R ${{ github.repository }} --workflow=repair --status=in_progress --json databaseId --jq length)
          if [ "$N" -gt 1 ]; then echo "FAIL: another repair in_progress (serial-only), abort"; exit 1; fi
      - name: dispatch worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DISPATCH_T=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run worker.yml -R ${{ github.repository }} \
            -F task="$(cat prompt.txt)" -f brain='${{ inputs.brain }}' -f think='${{ inputs.think }}'
          NEW_RUN_ID=""
          for i in $(seq 1 30); do
            sleep 20
            NEW_RUN_ID=$(gh run list -R ${{ github.repository }} --workflow=worker --limit=5 \
              --json databaseId,createdAt --jq "[.[] | select(.createdAt > \"$DISPATCH_T\")] | .[0].databaseId // empty")
            if [ -n "$NEW_RUN_ID" ]; then break; fi
          done
          if [ -z "$NEW_RUN_ID" ]; then echo "FAIL: no worker run materialized after dispatch"; exit 1; fi
          echo "NEW_RUN_ID=$NEW_RUN_ID" >> "$GITHUB_ENV"
          echo "watching $NEW_RUN_ID (serial-only: no concurrent repair runs in v1)"
      - name: watch and fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch "$NEW_RUN_ID" -R ${{ github.repository }} --exit-status
          gh run download "$NEW_RUN_ID" -n draft-output -R ${{ github.repository }} -D new
          python3 - <<'EOF'
          import re, os
          text = open('new/draft-output.md', errors='replace').read()
          fences = []
          cur = None
          for line in text.splitlines():
              ln = line.strip()
              if ln.startswith("```rust"):
                  cur = []
              elif ln == "```" and cur is not None:
                  fences.append("\n".join(cur))
                  cur = None
              elif cur is not None:
                  cur.append(line)
          print('NEW FENCES: %d' % len(fences))
          repairable = None
          for f in fences:
              if re.search(r"\bfn\s+\w+[^\n{]*\{", f):
                  repairable = f.strip()
          if repairable is None:
              print('FAIL: no fence with a fn item in new artifact')
              raise SystemExit(1)
          open('new/fence.txt', 'w').write(repairable + '\n')
          print('NEW FENCE BYTES: %d' % len(repairable))
          EOF
      - name: upload repair result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-result
          path: |
            prompt.txt
            new/draft-output.md
            new/fence.txt
          if-no-files-found: warn
      - name: auto grade
        if: ${{ inputs.auto_grade == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run grade.yml -R ${{ github.repository }} -f run_id="$NEW_RUN_ID" -f task_id='${{ inputs.grade_task_id }}'
