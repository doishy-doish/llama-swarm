name: grade-options1
# Trial oracle for the maybe_ice_cream FUNCTION task (options1 table, machine-executed).
# Verdict encoded in artifact NAME: verdict-opt-PASS (7/7) / verdict-opt-FAIL (else, incl NOFENCE/COMPILE-FAIL).
# Always exits 0. Mirrors grade.yml CASES + first-fn-fence doctrine.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Worker run id whose draft-output artifact to grade'
        required: true
permissions:
  actions: read
  contents: read
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: install rustc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rustc && rustc --version
      - name: fetch artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.run_id }} -n draft-output -R ${{ github.repository }} -D graded && ls -la graded
      - name: decide verdict
        run: |
          python3 - <<'EOF'
          import os, re, subprocess
          text = open('graded/draft-output.md', errors='replace').read()
          fences = []
          cur = None
          for line in text.splitlines():
              s = line.strip()
              if s.startswith("```rust"):
                  cur = []
              elif s == "```" and cur is not None:
                  fences.append("\n".join(cur))
                  cur = None
              elif cur is not None:
                  cur.append(line)
          cand = [f for f in fences if re.search(r"\bfn\s+maybe_ice_cream\b", f)]
          undefined
          CASES = [(0, 'Some(5)'), (9, 'Some(5)'), (18, 'Some(5)'),
                   (22, 'Some(0)'), (23, 'Some(0)'), (24, 'None'), (25, 'None')]
          fails = []
          if fn is None:
              fails = ["NO-FN-FENCE"]
              print("NO-FN-FENCE (fences=%d)" % len(fences))
          else:
              main = fn.strip() + "\nfn main() {\n"
              for hour, want in CASES:
                  main += '    if maybe_ice_cream(' + str(hour) + ') == ' + want + ' { println!("PASS ' + str(hour) + '"); } else { println!("FAIL ' + str(hour) + '"); }\n'
              main += "}\n"
              open('t.rs', 'w').write(main)
              c = subprocess.run(['rustc', '-O', 't.rs', '-o', 't'], capture_output=True, text=True)
              if c.returncode != 0:
                  fails = ["COMPILE-FAIL"]
                  print("COMPILE-FAIL:")
                  print(c.stderr[:800])
              else:
                  r = subprocess.run(['./t'], capture_output=True, text=True)
                  out = r.stdout.strip()
                  print(out.replace("\n", " | "))
                  for line in out.split("\n"):
                      if line.startswith("FAIL"):
                          fails.append(line)
          verdict = "PASS" if not fails else "FAIL"
          print("VERDICT=" + verdict + " fails=" + str(fails)[:300])
          open(os.environ["GITHUB_ENV"], "a").write("VERDICT=" + verdict + "\n")
          open("verdict-opt-" + verdict, "w").write(verdict + "\n" + "\n".join(fails) + "\n")
          hours = [0, 9, 18, 22, 23, 24, 25]
          for h in hours:
              hit = "1" if any(f.startswith("FAIL %d" % h) for f in fails) else "0"
              open(os.environ["GITHUB_ENV"], "a").write("FAIL%02d=%s\n" % (h, hit))
          EOF
      - name: upload verdict PASS
        if: env.VERDICT == 'PASS'
        uses: actions/upload-artifact@v4
        with: {name: verdict-opt-PASS, path: verdict-opt-PASS, if-no-files-found: error}
      - name: upload verdict FAIL
        if: env.VERDICT == 'FAIL'
        uses: actions/upload-artifact@v4
        with: {name: verdict-opt-FAIL, path: verdict-opt-FAIL, if-no-files-found: error}
      - name: failcase 00
        if: env.FAIL00 == '1'
        uses: actions/upload-artifact@v4
        with: {name: failcase-00, path: verdict-opt-FAIL, if-no-files-found: error}
      - name: failcase 09
        if: env.FAIL09 == '1'
        uses: actions/upload-artifact@v4
        with: {name: failcase-09, path: verdict-opt-FAIL, if-no-files-found: error}
      - name: failcase 18
        if: env.FAIL18 == '1'
        uses: actions/upload-artifact@v4
        with: {name: failcase-18, path: verdict-opt-FAIL, if-no-files-found: error}
      - name: failcase 22
        if: env.FAIL22 == '1'
        uses: actions/upload-artifact@v4
        with: {name: failcase-22, path: verdict-opt-FAIL, if-no-files-found: error}
      - name: failcase 23
        if: env.FAIL23 == '1'
        uses: actions/upload-artifact@v4
        with: {name: failcase-23, path: verdict-opt-FAIL, if-no-files-found: error}
      - name: failcase 24
        if: env.FAIL24 == '1'
        uses: actions/upload-artifact@v4
        with: {name: failcase-24, path: verdict-opt-FAIL, if-no-files-found: error}
      - name: failcase 25
        if: env.FAIL25 == '1'
        uses: actions/upload-artifact@v4
        with: {name: failcase-25, path: verdict-opt-FAIL, if-no-files-found: error}
