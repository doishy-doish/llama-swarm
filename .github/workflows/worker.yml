name: worker
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task for the draft worker (one scoped job, one artifact out)'
        required: true
        default: 'hello-probe'
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: restore brain cache
        uses: actions/cache@v4
        with:
          path: |
            model
            llama-bin
          key: brain-qwen05b-v1
      - name: draft
        env:
          TASK: ${{ inputs.task }}
        run: |
          chmod +x .github/worker/draft.sh
          .github/worker/draft.sh
      - name: upload draft
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-output
          path: draft-output.md
