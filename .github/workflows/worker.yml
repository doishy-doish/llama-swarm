name: worker
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task for the draft worker (one scoped job, one artifact out)'
        required: true
        default: 'hello-probe'
      endpoint:
        description: 'Inference endpoint URL (probe knob)'
        required: false
        default: 'https://models.github.ai/inference/chat/completions'
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK: ${{ inputs.task }}
          ENDPOINT: ${{ inputs.endpoint }}
        run: |
          chmod +x .github/worker/draft.sh
          .github/worker/draft.sh
      - name: upload draft
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-output
          path: draft-output.md
