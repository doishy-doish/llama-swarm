name: probe-output
# Trial probe v2: exfiltrates draft-output SHAPE via STATIC artifact names
# (expression-in-name failed; static names + if-conditions are the proven pattern).
# Emits up to three artifacts per run, e.g.: shape-nf0 + shape-nbm + shape-main0
# (NF=fence count bucket 0/1/2p, NB=byte bucket s<400/m<800/l>=800, MAIN=has-fn-main).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Worker run id whose draft-output artifact to probe'
        required: true
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: fetch artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.run_id }} -n draft-output -R ${{ github.repository }} -D probed && ls -la probed
      - name: compute shape
        run: |
          python3 - <<'EOF'
          import os, re
          raw = open('probed/draft-output.md', errors='replace').read()
          fences = re.findall(r"```rust(.*?)```", raw, re.S)
          nf = len(fences)
          nf_buk = "nf0" if nf == 0 else ("nf1" if nf == 1 else "nf2p")
          nb = len(raw.encode('utf-8'))
          nb_buk = "nbs" if nb < 400 else ("nbm" if nb < 800 else "nbl")
          main = "main1" if re.search(r"\bfn\s+main\b", raw) else "main0"
          envf = open(os.environ["GITHUB_ENV"], "a")
          envf.write("NFBUK=" + nf_buk + "\nNBBUK=" + nb_buk + "\nMAIN=" + main + "\nNB=" + str(nb) + "\n")
          envf.close()
          open("marker.txt", "w").write("nf=%d nb=%d main=%s\n" % (nf, nb, main))
          print("nf=%d nb=%d main=%s" % (nf, nb, main))
          EOF
          cat marker.txt
      - name: shape nf0
        if: env.NFBUK == 'nf0'
        uses: actions/upload-artifact@v4
        with: {name: shape-nf0, path: marker.txt, if-no-files-found: error}
      - name: shape nf1
        if: env.NFBUK == 'nf1'
        uses: actions/upload-artifact@v4
        with: {name: shape-nf1, path: marker.txt, if-no-files-found: error}
      - name: shape nf2p
        if: env.NFBUK == 'nf2p'
        uses: actions/upload-artifact@v4
        with: {name: shape-nf2p, path: marker.txt, if-no-files-found: error}
      - name: shape nbs
        if: env.NBBUK == 'nbs'
        uses: actions/upload-artifact@v4
        with: {name: shape-nbs, path: marker.txt, if-no-files-found: error}
      - name: shape nbm
        if: env.NBBUK == 'nbm'
        uses: actions/upload-artifact@v4
        with: {name: shape-nbm, path: marker.txt, if-no-files-found: error}
      - name: shape nbl
        if: env.NBBUK == 'nbl'
        uses: actions/upload-artifact@v4
        with: {name: shape-nbl, path: marker.txt, if-no-files-found: error}
      - name: shape main0
        if: env.MAIN == 'main0'
        uses: actions/upload-artifact@v4
        with: {name: shape-main0, path: marker.txt, if-no-files-found: error}
      - name: shape main1
        if: env.MAIN == 'main1'
        uses: actions/upload-artifact@v4
        with: {name: shape-main1, path: marker.txt, if-no-files-found: error}
